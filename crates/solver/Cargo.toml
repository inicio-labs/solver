[package]
name = "solver"
version = "0.1.0"
edition = "2021"

[features]
default = []
testing = []

[dependencies]
consume-script = { path = "../consume-script" }
# Shared RFQ wire protocol with external fillers. Depend on it for the protocol
# types only (default features ⇒ no extra miden deps); the SDK is the crate
# external DEXes import. One definition of the protocol, so the two can't drift.
pswap-lp-sdk = { path = "../lp-sdk" }
miden-client = { workspace = true }
miden-protocol.workspace = true
miden-standards.workspace = true
miden-core.workspace = true
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.40", features = ["macros", "time", "sync", "rt-multi-thread", "net"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.8"
diesel = { version = "2.2", default-features = false, features = ["postgres", "r2d2"] }
diesel_migrations = "2.3"
axum = { version = "0.8", features = ["json", "ws"] }
# Public price-API protections: request timeout + response cache header.
# (Concurrency-shedding uses a tokio Semaphore middleware; body cap uses axum's
# DefaultBodyLimit — no extra crates needed for those.)
tower-http = { version = "0.6", default-features = false, features = ["timeout", "set-header", "cors"] }
hex = "0.4"
subtle = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
ruint = "1.18"
range-set-blaze = "0.7"
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
# Exact decimal arithmetic for Binance prices (ADR 0004).
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
# Binance price feed (ADR 0004): WebSocket readers over an explicitly
# configured Rustls client (ring provider, webpki roots; the feed passes its
# own ClientConfig).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
miden-crypto.workspace = true
axum-test = "20"
wiremock = "0.6"
# Re-enable the `testing` feature on miden-client AND miden-protocol for the
# TEST build only (integration tests use `miden_client::testing::mock::MockRpcApi`
# + miden-protocol/miden-testing utilities). With resolver = "2" this never
# reaches the production lib/bin build.
miden-client = { workspace = true, features = ["testing"] }
miden-client-sqlite-store = { workspace = true }
miden-protocol = { workspace = true, features = ["testing"] }
miden-testing.workspace = true
consume-script = { path = "../consume-script" }
tempfile = "3"
# Local Binance stand-in for the price feed tests.
mock-binance = { path = "../mock-binance", default-features = false }
# Surfaces the solver's tracing logs in integration tests (e.g. the executor's
# exact failure assertion) under `--nocapture`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Adversarial property-based fuzzing of the matching math (pentest).
proptest = "1"
# test-util is dev-only; enables tokio::time::pause/advance + start_paused on #[tokio::test].
tokio = { version = "1.40", features = ["test-util"] }
