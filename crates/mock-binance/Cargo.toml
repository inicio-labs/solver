[package]
name = "mock-binance"
version = "0.1.0"
edition = "2021"
publish = false

# Local stand-in for Binance Spot public market data: `exchangeInfo` and the
# combined `bookTicker` stream. No miden deps, so it builds in seconds. The
# solver's tests use the library; devnet/local runs use the binary (feature
# `cli`).

[lib]
path = "src/lib.rs"

[[bin]]
name = "mock-binance"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber", "tokio/signal"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
anyhow = { version = "1.0", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"], optional = true }
