[workspace]
members = ["crates/solver", "crates/consume-script", "crates/e2e", "crates/mock-price", "crates/mock-mirror", "crates/lp-sdk"]
resolver = "2"

[workspace.dependencies]
# Miden 0.17 release candidates: client rc.2 depends on protocol/standards
# rc.6 and VM 0.33. Pin the full set so price and PSWAP behavior cannot drift
# across builds. MSRV 1.98.1 — see rust-toolchain.toml.
#
# NO "testing" feature on the production miden-client/miden-protocol deps — it
# gates miden-client's test helpers and protocol test utilities. Tests
# re-enable it in `[dev-dependencies]` (see crates/solver); resolver = "2" keeps
# it out of the production build.
miden-client = { version = "=0.17.0-rc.2", default-features = false, features = ["std", "tonic"] }
miden-client-sqlite-store = "=0.17.0-rc.2"
miden-protocol = { version = "=0.17.0-rc.6", default-features = false }
miden-standards = "=0.17.0-rc.6"
miden-testing = "=0.17.0-rc.6"
miden-core = "=0.33.0"
miden-crypto = "=0.33.0"

[package]
name = "solver-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
solver = { path = "crates/solver" }
miden-client = { workspace = true }
miden-client-sqlite-store = { workspace = true }
miden-protocol.workspace = true
miden-standards.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
rand = "0.9"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "env"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
consume-script = { path = "crates/consume-script" }
miden-testing.workspace = true
