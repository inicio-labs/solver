[workspace]
members = ["crates/solver", "crates/consume-script", "crates/e2e", "crates/mock-binance", "crates/mock-mirror", "crates/lp-sdk"]
resolver = "2"

[workspace.dependencies]
# Miden 0.17 final: client 0.17.1 depends on protocol/standards 0.17.0 and
# VM 0.35. Pin the full set so price and PSWAP behavior cannot drift across
# builds. MSRV 1.98.1 — see rust-toolchain.toml.
#
# NO "testing" feature on the production miden-client/miden-protocol deps — it
# gates miden-client's test helpers and protocol test utilities. Tests
# re-enable it in `[dev-dependencies]` (see crates/solver); resolver = "2" keeps
# it out of the production build.
miden-client = { version = "=0.17.1", default-features = false, features = ["std", "tonic"] }
miden-client-sqlite-store = "=0.17.1"
miden-protocol = { version = "=0.17.0", default-features = false }
miden-standards = "=0.17.0"
miden-testing = "=0.17.0"
miden-core = "=0.35.0"
miden-crypto = "=0.35.0"

[package]
name = "solver-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
solver = { path = "crates/solver" }
miden-client = { workspace = true }
miden-client-sqlite-store = { workspace = true }
miden-protocol.workspace = true
miden-standards.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
rand = "0.9"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
consume-script = { path = "crates/consume-script" }
miden-testing.workspace = true

# The integration tests prove real Miden transactions. With an unoptimised
# prover they take well over an hour on CI. Optimise dependencies only: our own
# crates still compile fast and debug normally.
[profile.dev.package."*"]
opt-level = 3
