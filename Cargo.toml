[workspace]
members = ["crates/solver", "crates/consume-script"]

[workspace.dependencies]
miden-client = { git = "https://github.com/0xMiden/miden-client", branch = "next", default-features = false, features = ["std", "tonic", "testing"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/miden-client", branch = "next" }
miden-protocol = { git = "https://github.com/0xMiden/protocol", branch = "next", default-features = false, features = ["testing"] }
miden-standards = { git = "https://github.com/0xMiden/protocol", branch = "next" }
miden-testing = { git = "https://github.com/0xMiden/protocol", branch = "next" }
miden-core = "0.22"
miden-crypto = "0.23"

[package]
name = "solver-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
solver = { path = "crates/solver" }
miden-client = { workspace = true }
miden-client-sqlite-store = { workspace = true }
miden-protocol.workspace = true
miden-standards.workspace = true
miden-core.workspace = true
miden-crypto.workspace = true
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
rand = "0.9"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "env"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
consume-script = { path = "crates/consume-script" }
miden-testing.workspace = true
