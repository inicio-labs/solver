// Market-maker gateway (ADR 0003, docs/adr/0003-market-maker-v1-gateway.md).
//
// Every call carries the maker's API key as `authorization: Bearer <key>`
// metadata. TLS terminates at a proxy in front of the solver.
syntax = "proto3";

package solver.maker.v1;

service MakerGateway {
  // Durably accept a PSWAP note, private or public. Accepted does not mean
  // Live: the note becomes Live once it is verified on chain.
  rpc SubmitOrder(SubmitOrderRequest) returns (CommandReply);
  // Stop every order of this maker in the scope whose submit sequence is
  // below this command's sequence, including submits that arrive later.
  // Orders already reserved by a settlement may still fill; the reply counts
  // them.
  rpc CancelAll(CancelAllRequest) returns (CommandReply);
  // Stop one order by its lineage ID, even before its submit arrives.
  rpc CancelOrder(CancelOrderRequest) returns (CommandReply);
  // The stored reply of an earlier command, after a lost response.
  rpc GetCommand(GetCommandRequest) returns (CommandReply);
  // This maker's events after `after_seq`, a ReplayComplete once caught up,
  // then each new event once it commits, with periodic keep-alives carrying
  // the cursor. After any disconnect, reconnect with the last `seq` you
  // processed: no event is ever lost or reordered.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamMessage);
  // Report how far you have processed the feed; returns the server time and
  // your latest event sequence, so you can see your lag.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

message CommandHeader {
  // Identifies one logical command: retrying the same ID, sequence and
  // contents returns the stored reply. 1 to 128 bytes.
  string request_id = 1;
  // Maker-assigned, unique per maker across every command kind; 1 to 2^63-1.
  uint64 seq = 2;
}

message SubmitOrderRequest {
  CommandHeader header = 1;
  // The PSWAP note in miden's canonical `Note` serialization.
  bytes note = 2;
}

enum OrderType {
  // Every order type.
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_PSWAP = 1;
}

// Both directions of a pair; faucet IDs in either order.
message Market {
  bytes faucet_a = 1;
  bytes faucet_b = 2;
}

// Orders offering one faucet's asset for another's.
message Direction {
  bytes offered_faucet = 1;
  bytes requested_faucet = 2;
}

// Filters combine as an intersection; none set stops every order. A market
// and a direction of different pairs are rejected, never broadened.
message CancelAllRequest {
  CommandHeader header = 1;
  OrderType order_type = 2;
  Market market = 3;
  Direction direction = 4;
}

message CancelOrderRequest {
  CommandHeader header = 1;
  // Creator account ID (15 bytes) followed by the root note's serial number:
  // four big-endian u64 elements, the last minus the note's depth.
  bytes lineage_id = 2;
}

message GetCommandRequest {
  string request_id = 1;
}

message CommandReply {
  // The stored reply of an earlier identical command.
  bool replayed = 1;
  oneof result {
    Accepted accepted = 2;
    AlreadyRegistered already_registered = 3;
    Applied applied = 4;
    Stopped stopped = 5;
  }
}

message Accepted {}

// Another submit already claimed this note's lineage.
message AlreadyRegistered {}

message Applied {
  // The effective barrier: the highest cancel sequence in this scope.
  uint64 cutoff = 1;
  // Orders already reserved by a settlement, which may still fill.
  uint64 settling = 2;
}

message Stopped {
  uint64 settling = 1;
}

message StreamEventsRequest {
  // Replay from the event after this one; 0 replays the whole feed.
  uint64 after_seq = 1;
}

message StreamMessage {
  oneof message {
    MakerEvent event = 1;
    KeepAlive keep_alive = 2;
    ReplayComplete replay_complete = 3;
  }
}

// Sent once per stream: every event through `through_seq` has been sent;
// later events are live.
message ReplayComplete {
  uint64 through_seq = 1;
}

message KeepAlive {
  // The `seq` of the last event sent on this stream (or `after_seq`).
  uint64 cursor = 1;
  int64 server_time_unix_ms = 2;
}

message HeartbeatRequest {
  // The last event `seq` you have processed.
  uint64 received_through_seq = 1;
}

message HeartbeatReply {
  int64 server_time_unix_ms = 1;
  // Your newest event's `seq` (0 before your first event).
  uint64 latest_seq = 2;
}

// One event of the maker's feed. Sequences are contiguous per maker and
// define the order; timestamps do not.
message MakerEvent {
  uint64 seq = 1;
  string event_id = 2;
  int64 created_at_unix_ms = 3;
  // The order lineage the event concerns, when it concerns one.
  bytes lineage_id = 4;
  EventBody body = 5;
}

// The V1 feed is frozen at these three events (ADR 0003).
message EventBody {
  oneof kind {
    OrderStatus order_status = 1;
    SettlementPending settlement_pending = 2;
    SettlementResolved settlement_resolved = 3;
  }
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  // Verified on chain and eligible for matching.
  ORDER_STATE_LIVE = 1;
  // Rejected after an earlier Accepted reply.
  ORDER_STATE_REJECTED = 2;
  // Its note was verified spent elsewhere.
  ORDER_STATE_UNAVAILABLE = 3;
}

message OrderStatus {
  bytes note_id = 1;
  // 0 for the submitted note, one more per partial fill.
  uint32 depth = 2;
  OrderState state = 3;
  string reason = 4;
}

// A settlement transaction is durable and may be broadcast. Fill details
// arrive with the executor's reporting.
message SettlementPending {
  bytes tx_id = 1;
}

// A settlement transaction was verified committed or definitively voided.
message SettlementResolved {
  bytes tx_id = 1;
  bool committed = 2;
}
