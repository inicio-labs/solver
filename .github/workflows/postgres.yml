name: PostgreSQL solver tests

on:
  push:
  pull_request:

jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: solver_test
          POSTGRES_USER: solver
          POSTGRES_PASSWORD: solver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solver -d solver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOLVER_TEST_DATABASE_URL: postgresql://solver:solver@127.0.0.1:5432/solver_test?connect_timeout=5
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native database libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev
      # The pre-existing workspace has unrelated rustfmt drift. Check every
      # Rust file changed by this migration without rewriting legacy modules.
      - name: Migration formatting
        run: |
          rustfmt --check --edition 2021 --config skip_children=true \
            crates/solver/src/db/postgres_*.rs crates/solver/src/db/maker_db.rs \
            crates/solver/src/maker.rs crates/solver/src/types.rs \
            crates/solver/src/admin/admin.rs crates/solver/src/config.rs \
            crates/solver/src/executor/executor.rs crates/solver/src/ingest/ingest.rs \
            crates/solver/src/matcher/clearing_book.rs crates/solver/src/matcher/matcher.rs \
            crates/solver/src/matcher/maker_index.rs crates/solver/src/gateway/*.rs \
            crates/solver/src/obs.rs \
            crates/solver/src/pipeline.rs crates/solver/src/price_api.rs \
            crates/solver/src/price_api/tests.rs crates/solver/src/start.rs \
            crates/solver/tests/common/mod.rs \
            crates/solver/tests/integration_{already_consumed,partial_fill,post_commit_kill,startup_failure,three_user_direct,unpriced_direct}.rs \
            crates/e2e/src/{artifacts,provision}.rs src/main.rs crates/solver/build.rs
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Lint solver packages
        run: cargo clippy -p solver -p solver-bin --locked
      - name: Pure solver tests
        run: cargo test -p solver --locked
      - name: PostgreSQL library tests
        run: cargo test -p solver --lib --locked -- --ignored --test-threads=2
      - name: PostgreSQL startup and recovery integration
        run: |
          cargo test -p solver --test integration_startup_failure --locked -- --ignored
          cargo test -p solver --test integration_already_consumed --locked -- --ignored
          cargo test -p solver --test integration_post_commit_kill --locked -- --ignored
      - name: Full and partial settlement integration
        run: |
          cargo test -p solver --test integration_three_user_direct --locked -- --ignored
          cargo test -p solver --test integration_partial_fill --locked -- --ignored
      # integration_unpriced_direct is a pre-existing, intentionally red audit
      # regression for C2 and is outside the PostgreSQL migration release gate.

  production-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: Native database libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev
      - name: Release build with PostgreSQL and SQLite client stores
        run: cargo build --release -p solver-bin --locked
